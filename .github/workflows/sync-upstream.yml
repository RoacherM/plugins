name: sync upstream

# Keep this fork's main up to date with magpie-community/plugins while
# keeping the local fix (the pi phrases in tool output). It merges upstream
# into main, runs the factory tests, and pushes only when both pass.
# A conflict or a failing test fails the job instead of pushing a broken main.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        run: |
          git config user.name "fork-sync"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream https://github.com/magpie-community/plugins.git
          git fetch upstream main
          if ! git merge --no-edit upstream/main; then
            echo "::error::upstream/main conflicts with this fork's fix; resolve manually"
            git merge --abort
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test the factory package
        run: |
          cd packages/factory
          bun test
          cd ../..
          bun scripts/check.mjs factory

      - name: Push
        run: git push origin main
